<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-label="八个工作流的组合关系"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#6b8c95" stroke-width="1.5"/></marker></defs><rect width="1280" height="700" rx="20" fill="#f2f7f7"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="38" y="48" font-size="26" font-weight="700" fill="#163e48">八个工作流的组合关系</text><text x="38" y="79" font-size="17" fill="#647e85">业务结构示意 · 主对话管理任务，创作主线组织制作</text><rect x="350" y="108" width="580" height="96" rx="12" fill="#e5f3ef" stroke="#cbdcde"/><text x="370" y="146" font-size="22" fill="#134e50" font-weight="700" text-anchor="start">科普主对话</text><text x="370" y="180" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">管理用户反馈、任务阶段与已确认的信息</text><path d="M640 206 V230 H220 V258" fill="none" stroke="#6b8c95" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="265" width="350" height="126" rx="12" fill="#ffffff" stroke="#cbdcde"/><text x="70" y="303" font-size="22" fill="#134e50" font-weight="700" text-anchor="start">意图收集</text><text x="70" y="337" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">把聊天整理成需求</text><text x="70" y="364" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">输出：需求与补充问题</text><path d="M404 328 H452" fill="none" stroke="#6b8c95" stroke-width="2" marker-end="url(#arrow)"/><rect x="465" y="265" width="350" height="126" rx="12" fill="#ffffff" stroke="#cbdcde"/><text x="485" y="303" font-size="22" fill="#134e50" font-weight="700" text-anchor="start">痛点分析</text><text x="485" y="337" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">检索、聚类与推荐</text><text x="485" y="364" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">输出：候选与已选问题</text><path d="M819 328 H867" fill="none" stroke="#6b8c95" stroke-width="2" marker-end="url(#arrow)"/><rect x="880" y="265" width="350" height="126" rx="12" fill="#ffffff" stroke="#cbdcde"/><text x="900" y="303" font-size="22" fill="#134e50" font-weight="700" text-anchor="start">医学研究</text><text x="900" y="337" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">研究事实、目标与边界</text><text x="900" y="364" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">输出：医学目标卡</text><rect x="32" y="448" width="1216" height="215" rx="16" fill="#eaf0f8" stroke="#c5d4e6"/><text x="57" y="480" font-size="19" fill="#355977" font-weight="700" text-anchor="start">图文创作主线</text><path d="M1055 394 V428 H225 V498" fill="none" stroke="#6b8c95" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="502" width="350" height="126" rx="12" fill="#ffffff" stroke="#cbdcde"/><text x="70" y="540" font-size="22" fill="#134e50" font-weight="700" text-anchor="start">Script</text><text x="70" y="574" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">文案、质检与分镜</text><text x="70" y="601" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">输出：脚本包</text><path d="M404 565 H452" fill="none" stroke="#6b8c95" stroke-width="2" marker-end="url(#arrow)"/><rect x="465" y="502" width="350" height="126" rx="12" fill="#ffffff" stroke="#cbdcde"/><text x="485" y="540" font-size="22" fill="#134e50" font-weight="700" text-anchor="start">Graphic</text><text x="485" y="574" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">视觉资产、页面生成与检查</text><text x="485" y="601" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">输出：图片结果包</text><path d="M819 565 H867" fill="none" stroke="#6b8c95" stroke-width="2" marker-end="url(#arrow)"/><rect x="880" y="502" width="350" height="126" rx="12" fill="#ffffff" stroke="#cbdcde"/><text x="900" y="540" font-size="22" fill="#134e50" font-weight="700" text-anchor="start">Delivery</text><text x="900" y="574" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">图片附件与飞书页面记录</text><text x="900" y="601" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">输出：保存反馈</text></g></svg>
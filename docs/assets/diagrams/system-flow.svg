<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="490" viewBox="0 0 1280 490" role="img" aria-label="一个主题怎样成为一套图文"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#6b8c95" stroke-width="1.5"/></marker></defs><rect width="1280" height="490" rx="20" fill="#f2f7f7"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="38" y="48" font-size="26" font-weight="700" fill="#163e48">一个主题怎样成为一套图文</text><text x="38" y="79" font-size="17" fill="#647e85">业务流程示意 · 先明确内容，再组织表达与制作</text><rect x="38" y="113" width="274" height="126" rx="12" fill="#ffffff" stroke="#cbdcde"/><circle cx="68" cy="144" r="16" fill="#187c75"/><text x="68" y="150" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text x="94" y="151" font-size="22" fill="#134e50" font-weight="700" text-anchor="start">提出主题</text><text x="58" y="185" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">用户说明方向与读者</text><text x="58" y="212" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">例如：给家长看的科普</text><path d="M314 176 H339" fill="none" stroke="#6b8c95" stroke-width="2" marker-end="url(#arrow)"/><rect x="348" y="113" width="274" height="126" rx="12" fill="#ffffff" stroke="#cbdcde"/><circle cx="378" cy="144" r="16" fill="#187c75"/><text x="378" y="150" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text x="404" y="151" font-size="22" fill="#134e50" font-weight="700" text-anchor="start">收集需求</text><text x="368" y="185" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">合并多轮信息</text><text x="368" y="212" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">形成清楚的内容简报</text><path d="M624 176 H649" fill="none" stroke="#6b8c95" stroke-width="2" marker-end="url(#arrow)"/><rect x="658" y="113" width="274" height="126" rx="12" fill="#ffffff" stroke="#cbdcde"/><circle cx="688" cy="144" r="16" fill="#187c75"/><text x="688" y="150" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text x="714" y="151" font-size="22" fill="#134e50" font-weight="700" text-anchor="start">选择切入点</text><text x="678" y="185" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">研究并推荐具体问题</text><text x="678" y="212" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">用户明确选择本次选题</text><path d="M934 176 H959" fill="none" stroke="#6b8c95" stroke-width="2" marker-end="url(#arrow)"/><rect x="968" y="113" width="274" height="126" rx="12" fill="#ffffff" stroke="#cbdcde"/><circle cx="998" cy="144" r="16" fill="#187c75"/><text x="998" y="150" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text x="1024" y="151" font-size="22" fill="#134e50" font-weight="700" text-anchor="start">确认内容依据</text><text x="988" y="185" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">医学研究与目标卡</text><text x="988" y="212" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">确认内容范围和边界</text><rect x="38" y="335" width="274" height="126" rx="12" fill="#ffffff" stroke="#cbdcde"/><circle cx="68" cy="366" r="16" fill="#187c75"/><text x="68" y="372" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text x="94" y="373" font-size="22" fill="#134e50" font-weight="700" text-anchor="start">确认制作方式</text><text x="58" y="407" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">受众、平台与形式</text><text x="58" y="434" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">风格、比例等制作要求</text><path d="M314 398 H339" fill="none" stroke="#6b8c95" stroke-width="2" marker-end="url(#arrow)"/><rect x="348" y="335" width="274" height="126" rx="12" fill="#ffffff" stroke="#cbdcde"/><circle cx="378" cy="366" r="16" fill="#187c75"/><text x="378" y="372" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><text x="404" y="373" font-size="22" fill="#134e50" font-weight="700" text-anchor="start">文案与分镜</text><text x="368" y="407" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">Script组织表达</text><text x="368" y="434" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">锁定文字并分配页面</text><path d="M624 398 H649" fill="none" stroke="#6b8c95" stroke-width="2" marker-end="url(#arrow)"/><rect x="658" y="335" width="274" height="126" rx="12" fill="#ffffff" stroke="#cbdcde"/><circle cx="688" cy="366" r="16" fill="#187c75"/><text x="688" y="372" font-size="16" fill="white" font-weight="700" text-anchor="middle">7</text><text x="714" y="373" font-size="22" fill="#134e50" font-weight="700" text-anchor="start">系列图片</text><text x="678" y="407" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">Graphic组织视觉</text><text x="678" y="434" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">角色、风格、布局与检查</text><path d="M934 398 H959" fill="none" stroke="#6b8c95" stroke-width="2" marker-end="url(#arrow)"/><rect x="968" y="335" width="274" height="126" rx="12" fill="#ffffff" stroke="#cbdcde"/><circle cx="998" cy="366" r="16" fill="#187c75"/><text x="998" y="372" font-size="16" fill="white" font-weight="700" text-anchor="middle">8</text><text x="1024" y="373" font-size="22" fill="#134e50" font-weight="700" text-anchor="start">保存与使用</text><text x="988" y="407" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">Delivery上传附件</text><text x="988" y="434" font-size="17" fill="#31565e" font-weight="400" text-anchor="start">飞书页面记录与素材使用</text><path d="M1105 241 V280 H20 V398 H35" fill="none" stroke="#6b8c95" stroke-width="2" marker-end="url(#arrow)"/><text x="640" y="306" font-size="17" fill="#31565e" font-weight="400" text-anchor="middle">确认后的需求与内容目标，交给制作模块</text></g></svg>